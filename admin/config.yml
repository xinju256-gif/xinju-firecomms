backend:
  name: github
  repo: xinju256-gif/xinju-firecomms
  branch: main

locale: zh_Hans

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "articles"
    label: "技术文章"
    folder: "content/articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "文章标题"
        name: "title"
        widget: "string"
      - label: "发布时间"
        name: "date"
        widget: "datetime"
      - label: "文章摘要"
        name: "description"
        widget: "text"
        required: false
      - label: "封面图片"
        name: "image"
        widget: "image"
        required: false
      - label: "草稿（开启后不在网站展示）"
        name: "draft"
        widget: "boolean"
        default: false
        required: false
      - label: "正文"
        name: "body"
        widget: "markdown"

      - label: "英文标题 / English Title（选填）"
        name: "title_en"
        widget: "string"
        required: false
      - label: "英文摘要 / English Summary（选填）"
        name: "description_en"
        widget: "text"
        required: false
      - label: "英文正文 / English Body（选填）"
        name: "body_en"
        widget: "markdown"
        required: false
